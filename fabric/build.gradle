plugins {
    id 'com.gradleup.shadow'
}
architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    jettyBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation("dev.architectury:architectury-fabric:${rootProject.architectury_api_version}")
    modImplementation("com.electronwill.night-config:toml:3.6.0")
    modImplementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}")
    modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}")
    modImplementation("de.mrjulsen.mcdragonlib:dragonlib-fabric:${rootProject.minecraft_version}-${rootProject.dragonlib_version}")
     
    modImplementation("com.simibubi.create:create-fabric:${rootProject.create_fabric_version}")

    modCompileOnly("maven.modrinth:indium:1.0.34+mc1.20.1")
    modCompileOnly("mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}")
    modRuntimeOnly("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}")
    
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

dependencies {
    jettyBundle("org.eclipse.jetty:jetty-server:${rootProject.jetty_version}") {
        exclude group: "org.slf4j", module: "slf4j-api"
    }
    jettyBundle("org.eclipse.jetty.compression:jetty-compression-server:${rootProject.jetty_version}") {
        exclude group: "org.slf4j", module: "slf4j-api"
    }
    jettyBundle("org.eclipse.jetty.compression:jetty-compression-gzip:${rootProject.jetty_version}") {
        exclude group: "org.slf4j", module: "slf4j-api"
    }
}

def jettyRuntimeJars = configurations.jettyBundle.resolvedConfiguration.resolvedArtifacts.collect { art ->
    def m = art.moduleVersion.id
    "${m.group}:${m.name}:${m.version}".toString()
}

dependencies {
    jettyRuntimeJars.each { notation ->
        include(notation)
        runtimeOnly(notation)
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    from(rootProject.file('LICENSE'))

    from(rootProject.file('LICENSE'))
    from(rootProject.file('LICENSE_jetty'))
    from(rootProject.file('NOTICE.txt'))
}

remapJar {
    input.set shadowJar.archiveFile
}

plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "createrailwaysnavigator.mixins.json"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modCompileOnly("dev.architectury:architectury-forge:${rootProject.architectury_api_version}")
    modImplementation("de.mrjulsen.mcdragonlib:dragonlib-forge:${rootProject.minecraft_version}-${rootProject.dragonlib_version}")
    //modImplementation("io.github.MisterJulsen:MC-DragonLib2:1.20.1-beta-3.0.24")

    modImplementation("com.simibubi.create:create-${rootProject.minecraft_version}:${rootProject.create_forge_version}:slim") { transitive = false }
    modImplementation("net.createmod.ponder:Ponder-Forge-${rootProject.minecraft_version}:${rootProject.ponder_forge_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${rootProject.minecraft_version}:${rootProject.flywheel_forge_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${rootProject.minecraft_version}:${rootProject.flywheel_forge_version}")
    modImplementation("com.tterrag.registrate:Registrate:${rootProject.registrate_forge_version}")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    implementation("io.github.llamalad7:mixinextras-forge:0.5.3")

    
    modRuntimeOnly("curse.maven:time-control-303570:5095704")
    modRuntimeOnly("curse.maven:configured-457570:5180900")
    modRuntimeOnly("maven.modrinth:tramways:0.3.3-forge")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

afterEvaluate {
    if (!rootProject.hasProperty("lwjgl_version")) return

    tasks.named("configureLaunch").configure { task ->
        task.doLast {
            def classpathFile = file(".gradle/loom-cache/forge_minecraft_classpath.txt")
            if (!classpathFile.exists()) return

            def targetVersion = rootProject.lwjgl_version
            def lwjglPaths = [:]
            configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                    .findAll { it.moduleVersion.id.group == "org.lwjgl" && it.moduleVersion.id.version == targetVersion }
                    .each { a ->
                        def key = a.moduleVersion.id.name + (a.classifier ? "-${a.classifier}" : "")
                        lwjglPaths[key] = a.file.absolutePath
                    }

            def newContent = lwjglPaths.inject(classpathFile.text) { content, key, newPath ->
                def modName = key.replaceAll(/-(natives-.+)$/, "")
                def classifier = key == modName ? "" : key.substring(modName.length() + 1)
                def oldSuffix = classifier ? "${modName}-3.3.2-${classifier}.jar" : "${modName}-3.3.2.jar"
                content.readLines().collect { line ->
                    line.contains(oldSuffix) ? newPath : line
                }.join(System.lineSeparator())
            }

            if (newContent != classpathFile.text) {
                classpathFile.text = newContent
                println "✔ forge_minecraft_classpath.txt: LWJGL → ${targetVersion}"
            }
        }
    }
}


shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    from(rootProject.file('LICENSE'))
}

remapJar {
    input.set shadowJar.archiveFile
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}